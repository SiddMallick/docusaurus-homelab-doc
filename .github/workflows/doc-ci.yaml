name: Docusaurus CI

permissions:
  contents: read
  security-events: write

on:
    push:
        branches:
            - master
            - 'feature/**'
    
    pull_request:
        branches:
            - master
    
    schedule:
      - cron: '0 2 * * *'

env:
    IMAGE_NAME: msiddhartha1600/docusaurus-homelab-docs

jobs:
    secret-scan:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v6
          with:
            fetch-depth: 0
        
        - name: Run Gitleaks
          uses: gitleaks/gitleaks-action@v3
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        - name: Run TruffleHog
          uses: trufflesecurity/trufflehog@v3.95.5
          with:
            path: ./
            base: ${{ github.event.repository.default_branch }}
            head: HEAD
            extra_args: --only-verified
        


    dependency-scan:
        if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/feature/') || github.event_name=='pull_request'
        runs-on: ubuntu-22.04
        needs: secret-scan
        steps:
            - name: Checkout
              uses: actions/checkout@v6
            
            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                node-version: 20
                cache: npm # Caching npm dependencies at ~./npm
                cache-dependency-path: package-lock.json #package-lock.json file is cached for faster builds
            
            - name: Install deps
              run: npm ci --prefer-offline --no-audit

            - name: Run npm audit (fail on critical)
              run: |
                npm audit --audit-level=critical --json > npm-audit.json
              continue-on-error: true

            - name: Upload NPM Audit
              uses: actions/upload-artifact@v7
              with:
                name: NPM Audit
                path: npm-audit.json
                retention-days: 5
          
            - name: Build Docusaurus
              run: npm run build
            
            - name: Run Unit Tests (if any)
              run: |
                if [ -f package.json ] && jq -e '.scripts.test' package.json > /dev/null; then
                    npm test
                else
                    echo "No Tests found, skipping"
                fi
            
            - name: Archive Test Results
              uses: actions/upload-artifact@v7
              with:
                name: Unit-Test-Results
                path: test-results
                retention-days: 5

            - name: Report Test Coverage
              run: npm run coverage
            
            - name: Archive Coverage Report
              uses: actions/upload-artifact@v7
              with:
                name: Code-Coverage-Result
                path: coverage
                retention-days: 5

    sast-codeql:
      needs: dependency-scan
      runs-on: ubuntu-latest
      permissions:
        security-events: write
        contents: read
      steps:
        - uses: actions/checkout@v6

        - name: Initialize CodeQL
          uses: github/codeql-action/init@v4
          with:
            languages: javascript, javascript-typescript
            queries: +security-extended
        
        - name: Autobuild
          uses: github/codeql-action/autobuild@v4
        
        - name: Perform CodeQL analysis
          uses: github/codeql-action/analyze@v4


        

    semgrep:
      needs: dependency-scan
      runs-on: ubuntu-latest
      container:
        image: semgrep/semgrep

      steps:
        - name: Checkout Code
          uses: actions/checkout@v6

        - name: Run 
          id: semgrep
          continue-on-error: true
          run: |
                semgrep ci \
                  --config=p/security-audit \
                  --config=p/secrets\
                  --config=.semgrep.yml\
                  --sarif --output=semgrep.sarif
        
        - name: Upload SARIF file
          uses: github/codeql-action/upload-sarif@v4
          with:
            sarif_file: semgrep.sarif
          if: always()

        - name: Upload SARIF file as artifact
          uses: actions/upload-artifact@v7
          with:
            name: Semgrep SARIF file
            path: semgrep.sarif
            retention-days: 5
    
        - name: Quality Gate
          if: steps.semgrep.outcome == 'failure'
          run: |
            echo "Semgrep found security issues."
            exit 1
    
    container-scan:
        needs: [semgrep, sast-codeql]
        name: PR Docker build
        runs-on: ubuntu-22.04

        if: github.event_name=='pull_request'

        steps:
            - name: Checkout
              uses: actions/checkout@v6    

            - name: Build Docker Image
              run: |
                docker build -t $IMAGE_NAME:pr-${{ github.event.number }} .
            
            - name: Trivy Scan (on PR)
              uses: aquasecurity/trivy-action@v0.36.0
              with: 
                image-ref: ${{ env.IMAGE_NAME }}:pr-${{ github.event.number }}
                format: json
                output: trivy-scan-results.json
                exit-code: 1
                severity: CRITICAL,HIGH

            - name: Upload Artifact
              uses: actions/upload-artifact@v7
              with:
                name: Trivy
                path: trivy-scan-results.json
                retention-days: 1

    